services:
  postgres:
    image: postgres:16-alpine
    container_name: databridge_v3_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-databridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databridge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-databridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U databridge" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: databridge_v3_redis
    ports:
      - "6378:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: databridge_v3_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge_secret}@postgres:5432/${POSTGRES_DB:-databridge}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-super-secret-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-encryption-key!}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./sqlite_data:/data/sqlite
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: databridge_v3_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://192.168.2.149:8007}
    expose:
      - "5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: databridge_v3_mcp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge_secret}@postgres:5432/${POSTGRES_DB:-databridge}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-super-secret-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-encryption-key!}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./sqlite_data:/data/sqlite
    command: python -m app.mcp

  nginx:
    image: nginx:alpine
    container_name: databridge_v3_nginx
    restart: always
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      mcp:
        condition: service_started
    ports:
      - "5178:5178"      # HTTPS Frontend
      - "8007:8007"      # HTTPS Backend API
      - "9001:9001"      # HTTPS MCP Server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  certs:
