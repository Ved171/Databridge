events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Log formats
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;
  error_log   /var/log/nginx/error.log   warn;

  sendfile        on;
  keepalive_timeout  65;

  # Upstream definitions (internal Docker container routing)
  upstream frontend_upstream {
    server frontend:5173;
  }

  upstream backend_upstream {
    server backend:8000;
  }

  upstream mcp_upstream {
    server mcp:9000;
  }

  client_max_body_size 500M;

  # ---------------------------------------------------------------------------
  # 1. Databridge Frontend (databridge.synovergetech.com:5178)
  # ---------------------------------------------------------------------------
  server {
    listen 5178 ssl;
    server_name databridge.synovergetech.com;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://frontend_upstream/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 5178;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }

  # ---------------------------------------------------------------------------
  # 2. Databridge Backend API (databridge.synovergetech.com:8007)
  # ---------------------------------------------------------------------------
  server {
    listen 8007 ssl;
    server_name databridge.synovergetech.com;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://backend_upstream/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8007;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }

  # ---------------------------------------------------------------------------
  # 3. Databridge MCP Server (databridge.synovergetech.com:9001)
  # ---------------------------------------------------------------------------
  server {
    listen 9001 ssl;
    server_name databridge.synovergetech.com;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://mcp_upstream/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 9001;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
